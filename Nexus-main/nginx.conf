# ============================================================
#  nginx.conf  ->  va en Nexus-main/  (junto al Dockerfile.frontend)
#  Sirve el React compilado y reenvia /api, /admin, /media al backend.
# ============================================================
server {
    listen 80;
    server_name _;

    # Fuerza UTF-8 en todas las respuestas (arregla tildes y simbolos)
    charset utf-8;
    source_charset utf-8;

    # Tamano maximo de subida (por si suben imagenes/archivos)
    client_max_body_size 20M;

    # --- Archivos estaticos de React ---
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no exista cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy hacia el backend Django ---
    # 'backend' es el nombre del servicio en docker-compose
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
