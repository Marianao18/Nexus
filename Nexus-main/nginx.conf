# ============================================================
#  nginx.conf  ->  va en Nexus-main/  (junto al Dockerfile)
#  Sirve el React compilado y reenvia /api, /admin, /media al backend.
# ============================================================
server {
    listen 80;
    server_name _;

    # Fuerza UTF-8 en todas las respuestas (arregla tildes y simbolos)
    charset utf-8;
    source_charset utf-8;

    # Tamano maximo de subida (por si suben imagenes/archivos)
    client_max_body_size 20M;

    # --- Archivos estaticos de React ---
    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANTE: los assets compilados de React viven en /static/ (build/static/).
    # nginx los sirve DIRECTAMENTE desde el disco, sin proxy al backend.
    # Cualquier archivo que no exista cae en index.html (necesario para SPA).
    location /static/ {
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no exista cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy hacia el backend Django ---
    # 'backend' es el nombre del servicio en docker-compose
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Estaticos de Django (admin, DRF, etc.) en una ruta separada
    # para NO chocar con los assets de React que estan en /static/.
    # OJO: en settings.py de Django debes poner STATIC_URL = '/django-static/'
    location /django-static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
